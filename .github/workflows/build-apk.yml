name: Compilar APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # El SDK de Android ya viene instalado en los servidores de GitHub (ANDROID_HOME).
      - name: Compilar el APK
        run: |
          echo "SDK de Android: $ANDROID_HOME"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AutoVideo-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publica el APK como "Release": se descarga con un enlace directo, sin iniciar sesión.
      # https://github.com/<usuario>/<repo>/releases/latest/download/AutoVideo.apk
      - name: Publicar el APK (enlace directo)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AutoVideo.apk
          gh release create "build-${{ github.run_number }}" AutoVideo.apk \
            --title "AutoYouTube (compilación ${{ github.run_number }})" \
            --notes "APK compilado automáticamente a partir de ${{ github.sha }}." \
            --latest
